{{- range .Values.components }}

{{- $component := . }}

{{- range .instances }}

apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $component.componentName }}-{{ .name }}

  labels:
    app: {{ $component.componentName }}-{{ .name }}

{{- with $.Values.global.labels }}
{{ toYaml . | nindent 4 }}
{{- end }}

spec:

  replicas: {{ $component.replicas }}

  selector:
    matchLabels:
      app: {{ $component.componentName }}-{{ .name }}

  template:
    metadata:

      labels:
        app: {{ $component.componentName }}-{{ .name }}

      annotations:
{{ toYaml $.Values.global.annotations | nindent 8 }}

    spec:

      imagePullSecrets:
{{ toYaml $.Values.global.imagePullSecrets | nindent 8 }}

      containers:

      - name: {{ $component.componentName }}

        image: {{ $component.image }}

        resources:
{{- if $component.resources }}
{{ toYaml $component.resources | nindent 10 }}
{{- else }}
{{ toYaml $.Values.global.resources | nindent 10 }}
{{- end }}

        envFrom:
        - configMapRef:
            name: {{ $component.componentName }}-{{ .name }}-config

---
{{- end }}
{{- end }}