{{- range .Values.components }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}

spec:
  replicas: {{ .replicas }}

  selector:
    matchLabels:
      app: {{ .name }}

  template:
    metadata:
      labels:
        app: {{ .name }}

    spec:
      containers:
      - name: {{ .name }}

        image: {{ .image }}

        imagePullPolicy: IfNotPresent

        envFrom:
        - configMapRef:
            name: {{ .name }}-config

        ports:
        - containerPort: {{ .port }}

---
{{- end }}