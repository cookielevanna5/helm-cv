global:
  annotations:
    prometheus.io/scrape: "true"
    sidecar.istio.io/inject: "true"

  imagePullSecrets:
    - name: dev-regcred

  labels:
    environment: dev
    team: backend

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

components:
  # ---------- Gateway ----------

  - componentName: gateway

    image: nginx:1.29
    replicas: 1

    commonConfig:
      LOG_LEVEL: debug

    instances:
      - name: default
        config:
          API_BASE_URL: http://orders-default:8080

  # ---------- Orders ----------

  - componentName: orders

    image: ghcr.io/acme/orders-service:1.2.0
    replicas: 1

    commonConfig:
      DB_PORT: "5432"
      LOG_LEVEL: debug

    instances:
      - name: default
        config:
          DB_HOST: postgres-dev
          REGION: dev

  # ---------- Payments ----------

  - componentName: payments

    image: ghcr.io/acme/payments-service:2.0.1
    replicas: 1

    commonConfig:
      PAYMENT_PROVIDER: sandbox
      LOG_LEVEL: debug

    instances:
      - name: default
        config:
          API_URL: payment-api-dev

  # ---------- Notifications ----------

  - componentName: notifications

    image: ghcr.io/acme/notifications-service:1.4.2
    replicas: 1

    commonConfig:
      SMTP_PORT: "25"

    instances:
      - name: default
        config:
          SMTP_HOST: smtp-dev.company.local
