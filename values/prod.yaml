global:
  annotations:
    prometheus.io/scrape: "true"

  imagePullSecrets:
    - name: prod-regcred

  labels:
    team: backend

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

components:
  # ---------- Gateway ----------

  - componentName: gateway

    image: nginx:1.29
    replicas: 3

    commonConfig:
      LOG_LEVEL: warn

    instances:
      - name: default
        config:
          API_BASE_URL: http://orders-eu:8080

  # ---------- Orders ----------

  - componentName: orders

    image: ghcr.io/acme/orders-service:1.3.0
    replicas: 5

    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

    commonConfig:
      DB_PORT: "5432"
      LOG_LEVEL: warn

    instances:
      - name: eu
        config:
          DB_HOST: postgres-eu
          REGION: eu

      - name: us
        config:
          DB_HOST: postgres-us
          REGION: us

      - name: asia
        config:
          DB_HOST: postgres-asia
          REGION: asia

  # ---------- Payments ----------

  - componentName: payments

    image: ghcr.io/acme/payments-service:2.1.0
    replicas: 4

    commonConfig:
      PAYMENT_PROVIDER: stripe
      LOG_LEVEL: warn

    instances:
      - name: default
        config:
          API_URL: payment-api

  # ---------- Notifications ----------

  - componentName: notifications

    image: ghcr.io/acme/notifications-service:1.5.0
    replicas: 3

    commonConfig:
      SMTP_PORT: "587"

    instances:
      - name: default
        config:
          SMTP_HOST: smtp.company.com
