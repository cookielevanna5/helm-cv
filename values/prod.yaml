components:
  - name: gateway
    replicas: 3
    image: nginx:1.29
    port: 80
    config:
      API_BASE_URL: http://orders-eu:8080
      LOG_LEVEL: warn

  - name: orders-eu
    replicas: 5
    image: ghcr.io/acme/orders-service:1.3.0
    port: 8080
    config:
      DB_HOST: postgres-eu
      DB_PORT: "5432"
      REGION: eu
      LOG_LEVEL: warn

  - name: orders-us
    replicas: 5
    image: ghcr.io/acme/orders-service:1.3.0
    port: 8080
    config:
      DB_HOST: postgres-us
      DB_PORT: "5432"
      REGION: us
      LOG_LEVEL: warn

  - name: payments
    replicas: 4
    image: ghcr.io/acme/payments-service:2.1.0
    port: 8080
    config:
      PAYMENT_PROVIDER: stripe
      LOG_LEVEL: warn

  - name: notifications
    replicas: 3
    image: ghcr.io/acme/notifications-service:1.5.0
    port: 8080
    config:
      SMTP_HOST: smtp.company.com
      SMTP_PORT: "587"
