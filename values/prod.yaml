global:
  labels:
    team: backend
    managed-by: helm

  annotations:
    prometheus.io/scrape: "true"

  imagePullSecrets:
    - name: prod-regcred

  nodeSelector:
    workload: production

  resources:
    requests:
      cpu: 500m
      memory: 512Mi

    limits:
      cpu: 2
      memory: 2Gi

components:
  - name: gateway
    replicas: 3
    image: nginx:1.29
    port: 80

    config:
      API_BASE_URL: http://orders-eu:8080

  - name: orders-eu
    replicas: 5
    image: ghcr.io/acme/orders-service:1.3.0
    port: 8080

    config:
      DB_HOST: postgres-eu
      REGION: eu

    annotations:
      region: eu

  - name: orders-us
    replicas: 5
    image: ghcr.io/acme/orders-service:1.3.0
    port: 8080

    config:
      DB_HOST: postgres-us
      REGION: us

    annotations:
      region: us

    resources:
      requests:
        cpu: 1
        memory: 1Gi

      limits:
        cpu: 4
        memory: 4Gi

  - name: payments
    replicas: 4
    image: ghcr.io/acme/payments-service:2.1.0
    port: 8080

    config:
      PAYMENT_PROVIDER: stripe

  - name: notifications
    replicas: 3
    image: ghcr.io/acme/notifications-service:1.5.0
    port: 8080

    config:
      SMTP_HOST: smtp.company.com
