global:
  annotations:
    prometheus.io/scrape: "true"
    sidecar.istio.io/inject: "true"

  imagePullSecrets:
    - name: preprod-regcred

  labels:
    environment: preprod
    team: backend

  resources:
    requests:
      cpu: 250m
      memory: 256Mi

    limits:
      cpu: 1
      memory: 1Gi

components:
  # ---------- Gateway ----------

  - componentName: gateway

    image: nginx:1.29
    replicas: 2

    commonConfig:
      LOG_LEVEL: info

    instances:
      - name: default
        config:
          API_BASE_URL: http://orders-default:8080

  # ---------- Orders ----------

  - componentName: orders

    image: ghcr.io/acme/orders-service:1.3.0-rc1
    replicas: 2

    commonConfig:
      DB_PORT: "5432"
      LOG_LEVEL: info

    instances:
      - name: default
        config:
          DB_HOST: postgres-preprod
          REGION: preprod

  # ---------- Payments ----------

  - componentName: payments

    image: ghcr.io/acme/payments-service:2.1.0-rc1
    replicas: 2

    commonConfig:
      PAYMENT_PROVIDER: stripe-sandbox
      LOG_LEVEL: info

    instances:
      - name: default
        config:
          API_URL: payment-api-preprod

  # ---------- Notifications ----------

  - componentName: notifications

    image: ghcr.io/acme/notifications-service:1.5.0-rc1
    replicas: 2

    commonConfig:
      SMTP_PORT: "25"

    instances:
      - name: default
        config:
          SMTP_HOST: smtp-preprod.company.local
