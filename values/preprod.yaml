global:
  labels:
    team: backend
    managed-by: helm

  annotations:
    prometheus.io/scrape: "true"
    sidecar.istio.io/inject: "true"

  imagePullSecrets:
    - name: regcred

  nodeSelector:
    workload: backend

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

components:
  - name: gateway
    replicas: 2
    image: nginx:1.29
    port: 80
    config:
      API_BASE_URL: http://orders:8080
      LOG_LEVEL: info

  - name: orders
    replicas: 2
    image: ghcr.io/acme/orders-service:1.3.0-rc1
    port: 8080
    config:
      DB_HOST: postgres-preprod
      DB_PORT: "5432"
      LOG_LEVEL: info

  - name: payments
    replicas: 2
    image: ghcr.io/acme/payments-service:2.1.0-rc1
    port: 8080
    config:
      PAYMENT_PROVIDER: stripe-sandbox
      LOG_LEVEL: info

  - name: notifications
    replicas: 2
    image: ghcr.io/acme/notifications-service:1.5.0-rc1
    port: 8080
    config:
      SMTP_HOST: smtp-preprod.company.local
      SMTP_PORT: "25"
