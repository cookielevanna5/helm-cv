global:
  labels:
    team: backend
    managed-by: helm

  annotations:
    prometheus.io/scrape: "true"
    sidecar.istio.io/inject: "true"

  imagePullSecrets:
    - name: regcred

  nodeSelector:
    workload: backend

  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

components:
  - name: gateway
    replicas: 1
    image: nginx:1.29
    port: 80

    config:
      API_BASE_URL: http://orders:8080
      LOG_LEVEL: debug

  - name: orders
    replicas: 1
    image: ghcr.io/acme/orders-service:1.2.0
    port: 8080

    config:
      DB_HOST: postgres-dev
      LOG_LEVEL: debug

  - name: payments
    replicas: 1
    image: ghcr.io/acme/payments-service:2.0.1
    port: 8080

    config:
      PAYMENT_PROVIDER: sandbox

  - name: notifications
    replicas: 1
    image: ghcr.io/acme/notifications-service:1.4.2
    port: 8080

    config:
      SMTP_HOST: smtp-dev.local
